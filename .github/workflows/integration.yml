name: Connected Supabase integration (dedicated test accounts)

on:
  workflow_dispatch:
    inputs:
      confirm_test_accounts:
        description: "Confirm the configured API points to the intended connected Supabase environment and both bearer tokens belong to dedicated test accounts. The suite deletes all saved learning data for Account A and preserves Account B's data."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tradequest-connected-supabase-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  two-account-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRADEQUEST_RUN_INTEGRATION_TESTS: 'true'
      TRADEQUEST_TEST_API_URL: ${{ secrets.TRADEQUEST_TEST_API_URL }}
      TRADEQUEST_TEST_USER_A_TOKEN: ${{ secrets.TRADEQUEST_TEST_USER_A_TOKEN }}
      TRADEQUEST_TEST_USER_B_TOKEN: ${{ secrets.TRADEQUEST_TEST_USER_B_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Require explicit dedicated-test-account confirmation
        env:
          CONFIRM_TEST_ACCOUNTS: ${{ inputs.confirm_test_accounts }}
        run: |
          if [ "$CONFIRM_TEST_ACCOUNTS" != "true" ]; then
            echo "::error::Confirm that both tokens belong to dedicated test accounts; the suite deletes all saved learning data for Account A."
            exit 1
          fi
      - name: Require all dedicated test secrets
        shell: bash
        run: |
          for name in TRADEQUEST_TEST_API_URL TRADEQUEST_TEST_USER_A_TOKEN TRADEQUEST_TEST_USER_B_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required repository secret: $name"
              exit 1
            fi
          done
          echo "All required integration secrets are present; secret values are not printed."
      - name: Validate configured API URL without exposing secrets
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const raw = process.env.TRADEQUEST_TEST_API_URL;
          let url;
          try { url = new URL(raw); } catch {
            console.error('::error::TRADEQUEST_TEST_API_URL must be a valid absolute URL.');
            process.exit(1);
          }
          if (!['https:', 'http:'].includes(url.protocol) || url.username || url.password || url.search || url.hash) {
            console.error('::error::API URL must use HTTP(S) and must not include credentials, query parameters, or fragments.');
            process.exit(1);
          }
          if (url.protocol !== 'https:' && !['localhost', '127.0.0.1'].includes(url.hostname)) {
            console.error('::error::Non-local integration endpoints must use HTTPS.');
            process.exit(1);
          }
          console.log('Integration API URL format validated; host and credentials are not printed.');
          NODE
      - name: Validate dedicated account tokens against deployed API
        env:
          TRADEQUEST_TEST_API_URL: ${{ secrets.TRADEQUEST_TEST_API_URL }}
          TRADEQUEST_TEST_USER_A_TOKEN: ${{ secrets.TRADEQUEST_TEST_USER_A_TOKEN }}
          TRADEQUEST_TEST_USER_B_TOKEN: ${{ secrets.TRADEQUEST_TEST_USER_B_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const base = new URL(process.env.TRADEQUEST_TEST_API_URL);
          const accounts = [
            ['Account A', process.env.TRADEQUEST_TEST_USER_A_TOKEN],
            ['Account B', process.env.TRADEQUEST_TEST_USER_B_TOKEN],
          ];
          let failed = false;
          for (const [label, token] of accounts) {
            const response = await fetch(new URL('/v1/me/progress', base), {
              headers: { Authorization: 'Bearer ' + token },
              cache: 'no-store',
            });
            if (!response.ok) {
              console.error(`::error::${label} token/API preflight failed with HTTP ${response.status}. Refresh the dedicated test token or deploy the current API. No integration writes have been started.`);
              failed = true;
            }
          }
          if (failed) process.exit(1);
          console.log('Both dedicated accounts authenticated against the configured API. Tokens and response bodies were not logged.');
          NODE
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Run the two-account API integration suite
        run: npm run test -- server/src/chart-dojo.integration.test.ts
